<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Materna Marketing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap">
<style>
:root{--ground:#F5F0E6;--surface:#FBF8F2;--ink:#313434;--muted:#626864;--rule:#E2DACB;--mint:#ADCFBE;--mint-deep:#3E6A56;--rose:#C8506F;--bad:#A2412D}
@media (prefers-color-scheme: dark){:root{--ground:#1C201F;--surface:#252A29;--ink:#ECE6DA;--muted:#A3AAA4;--rule:#353E3A;--mint:#7FA893;--mint-deep:#A9D0BC;--rose:#EE8BA6;--bad:#EE9A86}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;padding:24px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:34px 30px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:2rem;line-height:1.1}
p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5}
form{display:flex;flex-direction:column;gap:14px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:500}
input[type=password]{font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--rule);border-radius:5px;background:var(--ground);color:var(--ink)}
input[type=password]:focus-visible,button:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.remember{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
button{font:inherit;font-weight:600;font-size:.98rem;padding:11px;border:0;border-radius:5px;background:var(--mint-deep);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.error{color:var(--bad);font-size:.88rem;min-height:1.2em}
</style>
</head>
<body>
<main class="card">
  <span class="eyebrow">Materna Health · Marketing</span>
  <h1>Marketing Dashboard</h1>
  <p>This dashboard is private. Enter the team password to open it.</p>
  <form id="f">
    <label class="field">Password
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
    </label>
    <label class="remember"><input id="keep" type="checkbox" checked> Keep me signed in on this device</label>
    <button id="go" type="submit">Open dashboard</button>
    <div id="err" class="error" role="alert"></div>
  </form>
</main>

const KEY = "materna-pulse-pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
function store(pw){ try{ localStorage.setItem(KEY, pw); }catch(e){} }
function forget(){ try{ localStorage.removeItem(KEY); }catch(e){} }

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening…"; err.textContent = "";
  try{
    const html = await unlock(pw);
    if(document.getElementById("keep").checked) store(pw); else forget();
    show(html);
  }catch(x){
    err.textContent = "That password didn't work. Check it and try again.";
    btn.disabled = false; btn.textContent = "Open dashboard";
  }
});

(async () => {
  let saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(!saved) return;
  try{ show(await unlock(saved)); }catch(e){ forget(); }
})();
